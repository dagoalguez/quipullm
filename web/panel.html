<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quipullm</title>
<style>
  :root { --fondo:#f4f5f7; --panel:#fff; --linea:#dde1e6; --texto:#1f2328; --tenue:#667085; --ok:#1a7f37; --mal:#cf222e; --aviso:#9a6700; --acento:#0f5ea8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI", system-ui, sans-serif; background:var(--fondo); color:var(--texto); font-size:14px; }
  header { background:#1f2a37; color:#fff; padding:12px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  .insignia { padding:3px 10px; border-radius:12px; font-size:12px; font-weight:600; }
  .insignia.ok { background:#dafbe1; color:var(--ok); } .insignia.mal { background:#ffebe9; color:var(--mal); } .insignia.aviso { background:#fff8c5; color:var(--aviso); }
  main { padding:16px 20px; display:grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap:14px; max-width:1400px; }
  .tarjeta { background:var(--panel); border:1px solid var(--linea); border-radius:8px; padding:14px 16px; min-width:0; }
  .ancha { grid-column: 1 / -1; }
  h2 { font-size:14px; margin:0 0 10px; color:#344054; text-transform:uppercase; letter-spacing:.03em; }
  .fila { display:flex; gap:10px; padding:3px 0; align-items:baseline; }
  .fila > span:first-child { width:140px; color:var(--tenue); flex-shrink:0; }
  .mono, code { font-family:Consolas, monospace; font-size:13px; }
  .url { display:flex; justify-content:space-between; align-items:center; gap:8px; background:#f6f8fa; border:1px solid var(--linea); border-radius:6px; padding:7px 10px; margin-bottom:6px; font-family:Consolas, monospace; }
  button { font-family:inherit; font-size:13px; border:1px solid #c9ced6; background:#fff; border-radius:6px; padding:5px 11px; cursor:pointer; }
  button:hover { background:#f3f4f6; } button.prim { background:var(--acento); color:#fff; border-color:var(--acento); } button.prim:hover { background:#0c4d8a; }
  button:disabled { opacity:.5; cursor:default; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #eef0f3; vertical-align:top; }
  th { color:var(--tenue); font-weight:600; font-size:12px; }
  tr.cargado td { background:#eef6ff; }
  .tenue { color:var(--tenue); }
  .etq { font-size:11px; padding:1px 6px; border-radius:8px; background:#eef0f3; color:#475467; margin-left:4px; white-space:nowrap; }
  .etq.aviso { background:#fff8c5; color:var(--aviso); }
  .etq.si { background:#dafbe1; color:var(--ok); } .etq.no { background:#fff1e5; color:#bc4c00; }
  textarea, select, input { font-family:inherit; font-size:14px; border:1px solid #c9ced6; border-radius:6px; padding:7px 9px; width:100%; }
  textarea { min-height:80px; resize:vertical; }
  #salida { white-space:pre-wrap; background:#f6f8fa; border:1px solid var(--linea); border-radius:6px; padding:10px; min-height:60px; margin-top:8px; font-size:14px; }
  #salida .razon { color:var(--tenue); font-style:italic; }
  #logs { font-family:Consolas, monospace; font-size:12px; max-height:300px; overflow:auto; }
  #logs div { padding:2px 0; border-bottom:1px solid #f3f4f6; white-space:pre-wrap; }
  #logs .WARNING, #logs .ERROR { color:var(--mal); }
  .campo { display:flex; gap:8px; align-items:center; margin:5px 0; }
  .campo > label { width:170px; color:var(--tenue); flex-shrink:0; }
  .campo input[type=number] { width:120px; } .campo input[type=checkbox] { width:auto; }
  .rejilla { display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:4px 28px; }
  .aviso { background:#fff8c5; border:1px solid #eac54f; color:#6a4d00; border-radius:6px; padding:7px 10px; margin-bottom:8px; }
  .nota { background:#eef6ff; border:1px solid #c5def5; border-radius:6px; padding:8px 11px; }
  #explorador { border:1px solid var(--linea); border-radius:6px; margin-top:6px; background:#fbfbfc; display:none; }
  #explorador .cab { display:flex; gap:8px; align-items:center; padding:6px 8px; border-bottom:1px solid var(--linea); }
  #explorador .lista { max-height:220px; overflow:auto; }
  #explorador .lista div { padding:4px 10px; cursor:pointer; font-family:Consolas,monospace; font-size:13px; }
  #explorador .lista div:hover { background:#eef6ff; }
  #cfgMsg.ok { color:var(--ok); } #cfgMsg.mal { color:var(--mal); }
  .controles { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .enlacechat { background:#0f5ea8; color:#fff; text-decoration:none; padding:5px 14px; border-radius:6px; font-size:13px; font-weight:600; }
  .enlacechat:hover { background:#0c4d8a; }
  .compartir { border-radius:6px; padding:8px 11px; margin-top:8px; border:1px solid var(--linea); background:#f6f8fa; }
  .compartir.ok { background:#dafbe1; border-color:#9bd8ab; color:#14532d; }
  .compartir.mal { background:#ffebe9; border-color:#f1a9a4; color:#82071e; }
  .compartir code { user-select:all; background:#fff; padding:1px 6px; border-radius:4px; border:1px solid var(--linea); }
  td.celdachat { white-space:nowrap; } td.celdachat input[type=checkbox] { width:auto; vertical-align:middle; margin-right:4px; } td.celdachat button { padding:2px 8px; }
  details.avanzado { margin-top:10px; border-top:1px solid #eef0f3; padding-top:8px; }
  details.avanzado > summary { cursor:pointer; color:var(--acento); font-weight:600; padding:2px 0; }
  #bannerCarga { display:none; background:#eef6ff; border-bottom:1px solid var(--linea); padding:10px 20px; font-weight:600; color:var(--acento); }
  #bannerCarga .barra { height:6px; background:#d6e6f7; border-radius:3px; margin-top:7px; overflow:hidden; }
  #bannerCarga .barra i { display:block; height:100%; width:0; background:var(--acento); transition:width .4s; }
  #bannerCarga.indef .barra i { width:35%; animation:vaiven 1.2s ease-in-out infinite alternate; }
  @keyframes vaiven { from { margin-left:0 } to { margin-left:65% } }
  button.cargando { opacity:1; color:var(--acento); border-color:var(--acento); }
</style>
</head>
<body>
<header>
  <h1>quipullm</h1>
  <span id="insMotor" class="insignia aviso" data-i="engineBadge"></span>
  <span id="insTrabajo" class="tenue"></span>
  <span style="flex:1"></span>
  <a id="aChat" href="/chat" target="_blank" rel="noopener" class="enlacechat" data-i="openChat"></a>
  <select id="lang" aria-label="Language" style="width:auto;padding:3px 6px"><option value="en">English</option><option value="es">Español</option></select>
  <span class="tenue" id="version"></span>
</header>
<div id="bannerCarga" role="status" aria-live="polite"><span id="txtCarga"></span><div class="barra"><i id="barraCarga"></i></div></div>
<main>
  <section class="tarjeta">
    <h2 data-i="reach"></h2>
    <div id="urls"></div>
    <div id="chatEnlaces" style="margin-top:6px"></div>
    <div id="compartir"></div>
    <div class="tenue" style="margin-top:8px" data-ih="reachHelp"></div>
  </section>

  <section class="tarjeta">
    <h2 data-i="engine"></h2>
    <div class="fila"><span data-i="status"></span><b id="mEstado">—</b></div>
    <div class="fila"><span data-i="gpu"></span><span id="mGpu" class="mono">—</span></div>
    <div class="fila"><span data-i="loaded"></span><span id="mModelo" class="mono">—</span></div>
    <div class="fila"><span data-i="gpuMem"></span><span id="mMem" class="mono">—</span></div>
    <div class="fila"><span data-i="gpuType"></span><span id="mTipo">—</span></div>
    <div class="fila"><span data-i="ram"></span><span id="mRam" class="mono">—</span></div>
    <div class="fila"><span data-i="budget"></span><span id="mPres" class="mono">—</span></div>
    <div class="fila"><span data-i="queued"></span><span id="mCola">0</span></div>
    <div id="mAvisos"></div>
    <div class="controles">
      <button id="btnAbrir" data-i="openEngine"></button>
      <button id="btnDescargar" data-i="free"></button>
    </div>
  </section>

  <section class="tarjeta">
    <h2 data-i="usage"></h2>
    <div class="fila"><span data-i="requests"></span><span id="sPet">0</span></div>
    <div class="fila"><span data-i="tokensGen"></span><span id="sTok">0</span></div>
    <div class="fila"><span data-i="errors"></span><span id="sErr">0</span></div>
    <div class="fila"><span data-i="modelsDir"></span><span id="sDir" class="mono"></span></div>
  </section>

  <section class="tarjeta ancha nota" id="notaUso">
    <b data-i="noteHow"></b> <span data-i="noteBody1"></span> <b id="nPc" data-i="serverPc"></b> <span data-i="noteBody2"></span>
  </section>

  <section class="tarjeta ancha">
    <h2 data-i="config"></h2>
    <div id="cfgAviso" class="aviso" style="display:none"><span data-i="cfgRemote"></span> (<span class="nPc"></span>).</div>
    <div class="campo"><label for="cCarpeta" data-i="modelsDir"></label>
      <input id="cCarpeta" class="mono" placeholder="D:\models">
      <button id="btnExaminar" data-i="browse"></button></div>
    <div id="explorador">
      <div class="cab"><button id="exSubir" data-i="up"></button><span id="exRuta" class="mono" style="flex:1;word-break:break-all"></span>
        <span id="exInfo" class="tenue"></span><button class="prim" id="exElegir" data-i="useFolder"></button><button id="exCerrar" data-i="close"></button></div>
      <div class="lista" id="exLista"></div>
    </div>
    <div class="tenue" style="margin:2px 0 8px 178px" data-i="folderNote"></div>
    <div class="campo"><label for="cClaveApi" data-i="apiKey"></label><input id="cClaveApi" type="password" autocomplete="new-password" data-iph="noChange"><span class="tenue" id="cClaveEstado"></span></div>
    <details class="avanzado">
      <summary data-i="advanced"></summary>
    <div class="rejilla">
      <div>
        <div class="campo"><label for="cCtx" data-i="defCtx"></label><input id="cCtx" type="number" min="256" step="256"><span class="tenue" data-i="tokens"></span></div>
        <div class="campo"><label for="cKv" data-i="kvMax"></label><input id="cKv" type="number" min="0" step="64"><span class="tenue" data-i="mbAuto"></span></div>
        <div class="campo"><label for="cMemGpu" data-i="budget"></label><input id="cMemGpu" type="number" min="0" step="0.5"><span class="tenue" data-i="gbEst"></span></div>
        <div class="campo"><label for="cAuto" data-i="autoFit"></label><input id="cAuto" type="checkbox"><span class="tenue" data-i="autoFitHelp"></span></div>
        <div class="campo"><label for="cTimeout" data-i="timeout"></label><input id="cTimeout" type="number" min="30" step="30"><span class="tenue" data-i="timeoutHelp"></span></div>
        <div class="campo"><label for="cPuerto" data-i="port"></label><input id="cPuerto" type="number" min="1" max="65535"><span class="tenue" data-i="restart"></span></div>
        <div class="campo"><label for="cCola" data-i="maxQueue"></label><input id="cCola" type="number" min="0" step="1"><span class="tenue" data-i="maxQueueHelp"></span></div>
            <div class="campo"><label for="cMaxTok" data-i="defMaxTok"></label><input id="cMaxTok" type="number" min="0" step="64"><span class="tenue" data-i="defMaxTokHelp"></span></div>
        <div class="campo"><label for="cMaxLim" data-i="maxTokLimit"></label><input id="cMaxLim" type="number" min="0" step="64"><span class="tenue" data-i="maxTokLimitHelp"></span></div>
        <div class="campo"><label for="cAbrir" data-i="openAtStart"></label><input id="cAbrir" type="checkbox"></div>
      </div>
      <div>
        <div class="tenue" style="margin:5px 0" data-i="sampling"></div>
        <div class="campo"><label for="cTemp" data-i="temp"></label><input id="cTemp" type="number" step="0.05" min="0" max="5"></div>
        <div class="campo"><label for="cTopK">Top K</label><input id="cTopK" type="number" step="1" min="0"></div>
        <div class="campo"><label for="cTopP">Top P</label><input id="cTopP" type="number" step="0.01" min="0" max="1"></div>
        <div class="campo"><label for="cMinP">Min P</label><input id="cMinP" type="number" step="0.01" min="0" max="1"></div>
        <div class="campo"><label for="cRep" data-i="repPen"></label><input id="cRep" type="number" step="0.05" min="0.5" max="3"></div>
      </div>
    </div>
    </details>
    <div class="controles"><button class="prim" id="btnGuardarCfg" data-i="save"></button><span id="cfgMsg"></span></div>
  </section>

  <section class="tarjeta ancha">
    <h2 data-i="models"></h2>
    <table>
      <thead><tr><th data-i="thId"></th><th data-i="thArch"></th><th data-i="thQuant"></th><th data-i="thSize"></th><th data-i="thMem"></th><th data-i="thCtx"></th><th data-i="thChat"></th><th></th></tr></thead>
      <tbody id="tablaModelos"></tbody>
    </table>
    <details class="avanzado" id="detGen">
      <summary data-i="genTitle"></summary>
      <div class="tenue" style="margin:6px 0" data-ih="genNote"></div>
      <table><thead><tr><th data-i="thModel"></th><th data-i="thTemp"></th><th data-i="thMaxTok"></th><th data-i="thMaxLim"></th></tr></thead>
        <tbody id="tablaGen"></tbody></table>
      <div class="controles"><button class="prim" id="btnGuardarGen" data-i="genSave"></button><span id="genMsg"></span></div>
    </details>
    <div class="tenue" style="margin-top:8px" data-ih="chatNote"></div>
    <div class="controles"><button id="btnEscanear" data-i="rescan"></button><button id="btnChatTodos" data-i="chatAll"></button></div>
  </section>

  <section class="tarjeta ancha">
    <h2 data-i="test"></h2>
    <div class="tenue" style="margin:-4px 0 8px" data-ih="tryHint"></div>
    <div class="controles" style="margin-top:0">
      <select id="pModelo" style="max-width:360px"></select>
      <label class="tenue"><span data-i="lblTemp"></span> <input id="pTemp" type="number" step="0.1" min="0" max="5" placeholder="auto" style="width:70px"></label>
      <label class="tenue"><span data-i="lblMax"></span> <input id="pMax" type="number" min="1" placeholder="auto" style="width:80px"></label>
    </div>
    <div class="controles" id="filaClave" style="display:none"><label class="tenue" for="pClave" data-i="keyRequired"></label>
      <input id="pClave" type="password" autocomplete="off" style="max-width:260px"></div>
    <textarea id="pTexto" style="margin-top:8px"></textarea>
    <div class="controles">
      <button class="prim" id="btnEnviar" data-i="send"></button>
      <button id="btnParar" disabled data-i="stop"></button>
      <span id="pInfo" class="tenue"></span>
    </div>
    <div id="salida"></div>
  </section>

  <section class="tarjeta ancha">
    <h2 data-i="recent"></h2>
    <table>
      <thead><tr><th data-i="thTime"></th><th data-i="thModel"></th><th data-i="thFrom"></th><th data-i="thPrompt"></th><th data-i="thCompl"></th><th>tok/s</th><th data-i="thSecs"></th></tr></thead>
      <tbody id="tablaHist"></tbody>
    </table>
  </section>

  <section class="tarjeta ancha">
    <h2 data-i="log"></h2>
    <div id="logs"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const CLAVE = { get() { try { return localStorage.getItem("llm_clave") || ""; } catch { return ""; } }, set(v) { try { localStorage.setItem("llm_clave", v); } catch {} } };
const cab = (extra = {}) => Object.assign({}, extra, CLAVE.get() ? { Authorization: "Bearer " + CLAVE.get() } : {});
function copiar(txt, btn) {
  const listo = () => { if (btn) { const o = btn.textContent; btn.textContent = t("copied"); setTimeout(() => { btn.textContent = o; }, 1200); } };
  const respaldo = () => {
    const x = document.createElement("textarea"); x.value = txt; x.style.position = "fixed"; x.style.opacity = "0";
    document.body.append(x); x.select();
    try { document.execCommand("copy"); listo(); } catch {}
    x.remove();
  };
  // navigator.clipboard only exists on https:// or localhost; on http://192.168... the fallback is needed
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(listo, respaldo); else respaldo();
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  $("btnEnviar").disabled = true; $("btnParar").disabled = false;
  control = new AbortController();
  const t0 = performance.now();
  let n = 0, primer = null, razon = null, cont = null;
  $("pInfo").textContent = t("waiting");
  try {
    const r = await fetch("/v1/chat/completions", {
      method: "POST", headers: cab({ "Content-Type": "application/json" }), signal: control.signal,
      body: JSON.stringify(Object.assign({ model: $("pModelo").value, stream: true, messages: [{ role: "user", content: $("pTexto").value }] },
        $("pTemp").value !== "" ? { temperature: +$("pTemp").value } : {}, $("pMax").value !== "" ? { max_tokens: +$("pMax").value } : {})),
    });
    if (!r.ok) {
      if (r.status === 401) { claveRechazada = true; $("filaClave").style.display = "flex"; }
      salida.textContent = t("error") + (await r.json()).error.message; return;
    }
    claveRechazada = false;
    const lector = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await lector.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const linea = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!linea.startsWith("data:")) continue;
        const d = linea.slice(5).trim();
        if (d === "[DONE]") continue;
        const j = JSON.parse(d);
        if (j.error) { salida.append("\n[error] " + j.error.message); continue; }
        const delta = j.choices[0].delta || {};
        if (delta.reasoning_content) {
          if (!razon) { razon = document.createElement("span"); razon.className = "razon"; salida.append(razon); }
          razon.textContent += delta.reasoning_content;
        }
        if (delta.content) {
          if (!cont) { cont = document.createElement("span"); salida.append(cont); if (razon) cont.textContent = "\n\n"; }
          cont.textContent += delta.content;
        }
        if (delta.content || delta.reasoning_content) { n++; if (!primer) primer = performance.now(); }
        if (j.usage) n = j.usage.completion_tokens;
        const s = primer ? (performance.now() - primer) / 1000 : 0;
        $("pInfo").textContent = t("firstToken", { n, s: primer ? ((primer - t0) / 1000).toFixed(1) : "…" }) + (s > 0.5 ? ` · ${(n / s).toFixed(1)} tok/s` : "");
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") salida.append("\n[error] " + e.message);
  } finally {
    $("btnEnviar").disabled = false; $("btnParar").disabled = true;
  }
};
const CFG_CAMPOS = { cCarpeta: "models_dir", cCtx: "default_ctx", cKv: "kv_max_mb", cMemGpu: "gpu_memory_gb", cTimeout: "timeout_seconds", cCola: "max_queue", cPuerto: "port", cMaxTok: "default_max_tokens", cMaxLim: "max_tokens_limit" };
const CFG_MUESTREO = { cTemp: "temperature", cTopK: "top_k", cTopP: "top_p", cMinP: "min_p", cRep: "repeat_penalty" };
function msgCfg(t, ok) { $("cfgMsg").textContent = t; $("cfgMsg").className = ok ? "ok" : "mal"; }
async function cargarCfg() {
  try {
    const c = await (await fetch("/api/config")).json();
    for (const [id, k] of Object.entries(CFG_CAMPOS)) $(id).value = c[k];
    for (const [id, k] of Object.entries(CFG_MUESTREO)) $(id).value = c.default_sampling[k];
    $("cAbrir").checked = c.open_engine; $("cClaveEstado").textContent = c.api_key_from_env ? t("keyEnv") : (c.api_key_set ? t("keySet") : t("keyNone")); $("cAuto").checked = c.memory_check;
    const bloq = !c.editable;
    document.querySelectorAll("#cfgAviso ~ * input, #btnExaminar, #btnGuardarCfg").forEach((e) => { e.disabled = bloq; });
    cfgCargada = true;
  } catch {}
}
$("btnGuardarCfg").onclick = async () => {
  const cuerpo = { default_sampling: {}, open_engine: $("cAbrir").checked, memory_check: $("cAuto").checked };
  for (const [id, k] of Object.entries(CFG_CAMPOS)) cuerpo[k] = $(id).value;
  for (const [id, k] of Object.entries(CFG_MUESTREO)) cuerpo.default_sampling[k] = $(id).value;
  const nueva = $("cClaveApi").value.trim();
  if (nueva) cuerpo.api_key = nueva === "-" ? "" : nueva;
  msgCfg(t("saving"), true);
  const r = await fetch("/api/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) });
  const j = await r.json();
  if (!r.ok) return msgCfg(j.error.message, false);
  msgCfg(t("saved", { n: j.models }) + (j.restart_required ? t("savedRestart") : ""), true);
  if (nueva && nueva !== "-") CLAVE.set(nueva); else if (nueva === "-") CLAVE.set("");
  $("cClaveApi").value = ""; $("pClave").value = CLAVE.get(); cfgCargada = false;
  ultimoModelos = ""; refrescar();
};
let exRuta = "";
async function explorar(ruta) {
  const r = await fetch("/api/folders?path=" + encodeURIComponent(ruta));
  const j = await r.json();
  if (!r.ok) { $("exInfo").textContent = j.error.message; return false; }
  exRuta = j.path; $("exRuta").textContent = j.path || (LANG === "es" ? "Unidades" : "Drives");
  $("exInfo").textContent = j.path ? (LANG === "es" ? `${j.ggufs} archivo(s) .gguf aquí` : `${j.ggufs} .gguf file(s) here`) : "";
  $("exElegir").disabled = !j.path; $("exSubir").disabled = j.parent === null;
  $("exSubir").dataset.padre = j.parent ?? "";
  const sep = j.path.includes("\\") || /^[A-Za-z]:/.test(j.path) ? "\\" : "/";
  $("exLista").innerHTML = j.folders.map((n) => `<div data-r="${esc(j.path ? (j.path.endsWith(sep) ? j.path : j.path + sep) + n : n)}">📁 ${esc(n)}</div>`).join("")
    || `<div class="tenue">${LANG === "es" ? "(sin subcarpetas)" : "(no subfolders)"}</div>`;
  $("exLista").querySelectorAll("div[data-r]").forEach((d) => { d.onclick = () => explorar(d.dataset.r); });
  return true;
}
$("btnExaminar").onclick = () => { $("explorador").style.display = "block"; explorar($("cCarpeta").value.trim()).then((ok) => { if (!ok) explorar(""); }); };
$("exSubir").onclick = () => explorar($("exSubir").dataset.padre || "");
$("exElegir").onclick = () => { $("cCarpeta").value = exRuta; $("explorador").style.display = "none"; };
$("exCerrar").onclick = () => { $("explorador").style.display = "none"; };

$("lang").onchange = () => { LANG = $("lang").value; try { localStorage.setItem("quipullm_lang", LANG); } catch {} const antes = $("pTexto").dataset.def === "1" || !$("pTexto").value; aplicarIdioma(); if (antes) { $("pTexto").value = t("defaultPrompt"); $("pTexto").dataset.def = "1"; } ultimoModelos = ""; cfgCargada = false; refrescar(); };
$("pTexto").oninput = () => { $("pTexto").dataset.def = "0"; };
aplicarIdioma(); $("pTexto").value = t("defaultPrompt"); $("pTexto").dataset.def = "1";
refrescar(); refrescarLogs();
setInterval(refrescar, 2000); setInterval(refrescarLogs, 4000);
</script>
