<title>quipullm chat</title>
<style>

  .btn-cab { font-family:inherit; font-size:13px; color:#fff; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); border-radius:8px; padding:5px 12px; cursor:pointer; }

  .acerca-fondo[hidden] { display:none; }
  .acerca { position:relative; background:var(--panel); color:var(--texto); border:1px solid var(--linea); border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.35); padding:26px 28px 22px; width:100%; max-width:480px; max-height:100%; overflow-y:auto; text-align:center; font-size:14px; line-height:1.5; }
  .acerca-logo { color:var(--acento); }
  .acerca h2 { margin:6px 0 2px; font-size:20px; text-transform:none; letter-spacing:0; color:var(--texto); }
  .acerca-ver { color:var(--tenue); font-size:13px; margin-bottom:10px; }
  .acerca p { margin:8px 0; }

  .acerca-tabla tr:last-child th, .acerca-tabla tr:last-child td { border-bottom:1px solid var(--linea); }
  .acerca-tabla th { width:34%; color:var(--tenue); font-weight:600; }
  .acerca-copy { color:var(--tenue); font-size:12.5px; }
  .acerca-x { position:absolute; top:8px; right:12px; background:none; border:none; color:var(--tenue); font-size:24px; line-height:1; cursor:pointer; }
  .lat-pie .acerca-pie { border:none; color:var(--tenue); font-size:12px; padding:6px 4px; }
  .acerca-cerrar { font-family:inherit; font-size:14px; margin-top:8px; padding:8px 26px; border-radius:10px; border:1px solid var(--acento); background:var(--acento); color:#fff; cursor:pointer; }

  #lat { padding:5px 10px; font-size:16px; line-height:1; }
  @media (max-width:760px) { .lateral { position:absolute; z-index:6; top:0; bottom:0; left:0; box-shadow:var(--sombra); } }
  main { flex:1; overflow-y:auto; padding:20px 16px 36px; }
  #mensajes { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  .vacio { text-align:center; margin-top:8vh; }

  .vacio h2 { font-size:26px; margin:12px 0 6px; font-weight:600; }

  .msg .cuerpo p { margin:0 0 .7em; white-space:pre-wrap; } .msg .cuerpo > :last-child { margin-bottom:0; }
  .msg h1, .msg h2, .msg h3, .msg h4, .msg h5, .msg h6 { margin:.9em 0 .4em; line-height:1.3; font-weight:650; }

  .msg ul, .msg ol { margin:0 0 .7em; padding-left:1.5em; } .msg li { margin:.15em 0; }
  .msg blockquote { margin:0 0 .7em; padding:2px 12px; border-left:3px solid var(--linea); color:var(--tenue); }
  .msg hr { border:0; border-top:1px solid var(--linea); margin:.9em 0; }
  .msg table { border-collapse:collapse; margin:0 0 .7em; font-size:14.5px; display:block; overflow-x:auto; }
  .msg th, .msg td { border:1px solid var(--linea); padding:4px 10px; text-align:left; } .msg th { background:var(--codigo); }
  .msg .bloque { position:relative; margin:10px 0; }
  .msg .bloque .cp { position:absolute; top:6px; right:8px; font-family:inherit; font-size:12px; padding:1px 9px; background:var(--panel); color:var(--tenue); border:1px solid var(--linea); border-radius:8px; cursor:pointer; }
  .msg pre { background:var(--codigo); border:1px solid var(--linea); border-radius:10px; padding:10px 12px; overflow-x:auto; margin:0; white-space:pre; }
  .msg code { font-family:Consolas, "Cascadia Mono", monospace; font-size:13.5px; background:var(--codigo); border-radius:5px; padding:1px 5px; }
  .msg pre code { background:none; padding:0; }
  .msg details { color:var(--tenue); font-style:italic; margin-bottom:8px; white-space:pre-wrap; font-size:14px; border-left:3px solid var(--linea); padding-left:10px; }
  .msg details summary { cursor:pointer; font-style:normal; }
  .msg.error { color:var(--mal); border-left:3px solid var(--mal); padding-left:10px; }
  .meta { color:var(--tenue); font-size:12px; margin-top:6px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .meta button { font-family:inherit; font-size:12px; padding:1px 9px; background:transparent; color:var(--tenue); border:1px solid var(--linea); border-radius:8px; cursor:pointer; }
  footer { padding:6px 16px 12px; position:relative; }
  .abajo { position:absolute; left:50%; top:-46px; transform:translateX(-50%); width:36px; height:36px; padding:0; border-radius:50%; border:1px solid var(--linea); background:var(--panel); color:var(--texto); box-shadow:var(--sombra); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .abajo:hover { border-color:var(--acento); color:var(--acento); }
  .abajo[hidden] { display:none; }
  .caja { max-width:820px; margin:0 auto; }

  .compositor:focus-within { border-color:var(--acento); }
  textarea { flex:1; font-family:inherit; font-size:16px; border:0; outline:0; resize:none; overflow-y:hidden; min-height:28px; max-height:200px; background:transparent; color:var(--texto); padding:6px 0; }
  textarea::placeholder { color:var(--tenue); }
  button.enviar { font-family:inherit; font-size:14px; font-weight:600; border:0; background:var(--acento); color:var(--sobreacento); border-radius:12px; padding:9px 18px; cursor:pointer; }
  button.parar { font-family:inherit; font-size:14px; border:1px solid var(--linea); background:transparent; color:var(--texto); border-radius:12px; padding:9px 14px; cursor:pointer; }

  .pie { display:flex; gap:14px; align-items:center; margin-top:8px; font-size:12px; color:var(--tenue); flex-wrap:wrap; justify-content:center; }

</header>
<div class="area">

</aside>
<div id="acercaFondo" class="acerca-fondo" hidden>

    <h2 id="acercaTitulo"></h2>
    <div id="acercaVer" class="acerca-ver"></div>
    <p id="acercaDesc"></p>
    <table class="acerca-tabla">
      <tr><th id="acAutorK"></th><td id="acAutorV"></td></tr>
      <tr><th id="acContrK"></th><td id="acContrV"></td></tr>
      <tr><th id="acLicK"></th><td id="acLicV"></td></tr>
      <tr><th id="acRepoK"></th><td id="acRepoV"></td></tr>
    </table>
    <p id="acercaCopy" class="acerca-copy"></p>
    <p id="acercaModelos" class="acerca-copy"></p>
    <button id="acercaCerrar" type="button" class="acerca-cerrar"></button>
  </div>
</div>
<div class="col">
<div id="avisos"><div id="avisosTxt"></div><div id="avisoClave"></div></div>
<main><div id="mensajes" role="log" aria-live="polite"></div></main>
<footer><button id="abajo" type="button" class="abajo" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button><div class="caja">
  <div id="ctxAviso" class="ctxaviso" hidden><span id="ctxAvisoTxt"></span> <button id="ctxNuevo" type="button"></button></div>
  <div class="compositor">
    <textarea id="texto" rows="1"></textarea>
    <button id="parar" type="button" class="parar" disabled></button>
    <button id="enviar" type="button" class="enviar"></button>
  </div>
  <div class="pie">
    <a href="#" id="verSistema"></a>
    <span id="ctxInfo"></span>
  </div>
  <textarea id="sistema" hidden></textarea>
  <div class="privacidad" id="privacidad"></div>
  <span id="info" hidden></span>
</div></footer>
</div>

$("texto").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); enviar(); } };
$("enviar").onclick = () => enviar();
document.querySelector("main").addEventListener("scroll", () => { pegado = cercaDelFinal(); botonAbajo(); });
$("abajo").onclick = () => { pegado = true; document.querySelector("main").scrollTo({ top: document.querySelector("main").scrollHeight, behavior: "smooth" }); };
$("modelo").onchange = () => estado();
$("parar").onclick = () => control && control.abort();
$("ctxNuevo").onclick = () => $("nuevo").click();
$("nuevo").onclick = () => { sesion++; if (control) control.abort(); historial = []; chatId = null; ctxUsado = 0; pintarLista(); ctxPintar(); vacio(); pegado = true; botonAbajo(); $("texto").focus(); };
$("verSistema").onclick = (e) => { e.preventDefault(); $("sistema").hidden = !$("sistema").hidden; if (!$("sistema").hidden) $("sistema").focus(); };
$("lang").onchange = () => { LANG = $("lang").value; try { localStorage.setItem("quipullm_lang", LANG); } catch {} textos(); estado(); };

// ---- Saved chats: kept in this browser only (IndexedDB), never sent to the server.
const MAX_CHATS = 300;               // oldest chats are dropped beyond this (300 chats of a full context are roughly 10 MB of text)
const BD = {
  db: null,
  abrir() { return new Promise((ok) => { try { const r = indexedDB.open("quipullm_chats", 1); r.onupgradeneeded = () => r.result.createObjectStore("chats", { keyPath: "id" }); r.onsuccess = () => { BD.db = r.result; ok(true); }; r.onerror = r.onblocked = () => ok(false); } catch { ok(false); } }); },
  tx(modo, fn) { return new Promise((ok) => { if (!BD.db) return ok(null); try { const x = BD.db.transaction("chats", modo); let res = null; const q = fn(x.objectStore("chats")); if (q) q.onsuccess = () => { res = q.result; }; x.oncomplete = () => ok(res); x.onerror = x.onabort = () => ok(null); } catch { ok(null); } }); },
  todos() { return BD.tx("readonly", (s) => s.getAll()).then((x) => x || []); },
  poner(c) { return BD.tx("readwrite", (s) => s.put(c)); },
  borrar(id) { return BD.tx("readwrite", (s) => s.delete(id)); },
  vaciar() { return BD.tx("readwrite", (s) => s.clear()); }
};
let lista = [];
const nuevoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const titular = (h) => { const u = h.find((m) => m.role === "user"); const x = (u ? u.content : "").replace(/\s+/g, " ").trim(); return x ? (x.length > 48 ? x.slice(0, 48) + "…" : x) : t("untitled"); };
function ordenada() { return lista.slice().sort((a, b) => b.actualizado - a.actualizado); }
function pintarLista() {
  const d = $("lista"); d.textContent = "";
  if (!lista.length) { const e = document.createElement("div"); e.className = "sinchats"; e.textContent = t("noChats"); d.append(e); return; }
  for (const c of ordenada()) {
    const it = document.createElement("div"); it.className = "item" + (c.id === chatId ? " activo" : ""); it.setAttribute("role", "listitem");
    const b = document.createElement("button"); b.type = "button"; b.className = "tit"; b.textContent = c.titulo; b.title = c.titulo; b.onclick = () => mostrar(c);
    const r = document.createElement("button"); r.type = "button"; r.className = "ic"; r.textContent = "✎"; r.title = r.ariaLabel = t("rename");
    r.onclick = async () => { const n = prompt(t("renamePrompt"), c.titulo); if (n && n.trim()) { c.titulo = n.trim().slice(0, 120); await BD.poner(c); pintarLista(); } };
    const x = document.createElement("button"); x.type = "button"; x.className = "ic"; x.textContent = "✕"; x.title = x.ariaLabel = t("del");
    x.onclick = async () => { if (!confirm(t("delConfirm"))) return; await BD.borrar(c.id); lista = lista.filter((y) => y.id !== c.id); if (c.id === chatId) $("nuevo").click(); else pintarLista(); };
    it.append(b, r, x); d.append(it);
  }
}
async function guardar() {
  if (!BD.db || !historial.length) return;
  const ahora = Date.now();
  if (!chatId) chatId = nuevoId();
  let c = lista.find((y) => y.id === chatId);
  if (!c) { c = { id: chatId, creado: ahora, titulo: titular(historial) }; lista.push(c); }
  c.actualizado = ahora; c.modelo = $("modelo").value; c.sistema = $("sistema").value; c.ctx = ctxUsado;
  c.mensajes = historial.map((m) => (m.info ? { role: m.role, content: m.content, info: m.info } : { role: m.role, content: m.content }));
  await BD.poner(c);
  const sobran = ordenada().slice(MAX_CHATS).filter((y) => y.id !== chatId);
  for (const y of sobran) { await BD.borrar(y.id); lista = lista.filter((z) => z.id !== y.id); }
  pintarLista();
}
function mostrar(c) {
  sesion++; if (control) control.abort();
  historial = c.mensajes.map((m) => (m.info ? { role: m.role, content: m.content, info: m.info } : { role: m.role, content: m.content })); chatId = c.id; ctxUsado = c.ctx || 0; ctxPintar();
  if (c.modelo && [...$("modelo").options].some((o) => o.value === c.modelo)) $("modelo").value = c.modelo;
  $("sistema").value = c.sistema || "";
  $("mensajes").textContent = "";
  historial.forEach((m, i) => {
    const b = burbuja(m.role);
    if (m.role === "user") b.cuerpo.textContent = m.content;
    else { pintar(b.cuerpo, m.content); const meta = document.createElement("div"); meta.className = "meta"; meta.textContent = textoMeta(m.info || (c.modelo ? { modelo: c.modelo } : null)); b.d.append(meta); acciones(meta, m.content, i === historial.length - 1); }
  });
  pintarLista(); bajar(true); estado();
  if (innerWidth <= 760) $("lateral").hidden = true;
}
async function podar() {
  const dias = parseInt($("retencion").value, 10) || 0;
  if (!dias || !BD.db) return;
  const limite = Date.now() - dias * 86400000;
  for (const c of lista.filter((y) => y.actualizado < limite && y.id !== chatId)) await BD.borrar(c.id);
  lista = lista.filter((y) => y.actualizado >= limite || y.id === chatId);
}
function limpiar(c) {          // validate an imported chat: only plain text, bounded sizes
  if (!c || typeof c !== "object" || typeof c.id !== "string" || !c.id || c.id.length > 64 || !Array.isArray(c.mensajes) || c.mensajes.length > 4000) return null;
  const m = [];
  const ok = (v) => typeof v === "number" && isFinite(v);
  for (const x of c.mensajes) {
    if (!x || (x.role !== "user" && x.role !== "assistant") || typeof x.content !== "string" || x.content.length > 400000) return null;
    const y = { role: x.role, content: x.content };
    if (x.role === "assistant" && x.info && typeof x.info === "object") {
      const i = { modelo: typeof x.info.modelo === "string" ? x.info.modelo.slice(0, 200) : "" };
      if (ok(x.info.n)) i.n = x.info.n; if (ok(x.info.ttft)) i.ttft = x.info.ttft; if (ok(x.info.tps)) i.tps = x.info.tps;
      y.info = i;
    }
    m.push(y);
  }
  if (!m.length) return null;
  const num = (v, d) => (typeof v === "number" && isFinite(v) ? v : d), ahora = Date.now();
  return { id: c.id, titulo: (typeof c.titulo === "string" && c.titulo.trim() ? c.titulo : titular(m)).slice(0, 120), creado: num(c.creado, ahora), actualizado: num(c.actualizado, ahora),
    modelo: typeof c.modelo === "string" ? c.modelo.slice(0, 200) : "", sistema: typeof c.sistema === "string" ? c.sistema.slice(0, 20000) : "", ctx: num(c.ctx, 0), mensajes: m };
}
$("lat").onclick = () => { $("lateral").hidden = !$("lateral").hidden; try { localStorage.setItem("quipullm_lateral", $("lateral").hidden ? "0" : "1"); } catch {} };
$("latNuevo").onclick = () => { $("nuevo").click(); if (innerWidth <= 760) $("lateral").hidden = true; };
$("retencion").onchange = async () => { try { localStorage.setItem("quipullm_retencion", $("retencion").value); } catch {} await podar(); pintarLista(); };
// ---- About dialog (DOM text only) ----
function acercaAbrir() {
  acercaTextos(); $("acercaFondo").hidden = false; $("acercaCerrar").focus();
}
function acercaCerrar() { $("acercaFondo").hidden = true; const b = $("acerca"); if (b && b.offsetParent) b.focus(); }
$("acerca").onclick = acercaAbrir;
$("acercaX").onclick = $("acercaCerrar").onclick = acercaCerrar;
$("acercaFondo").onclick = (e) => { if (e.target === $("acercaFondo")) acercaCerrar(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("acercaFondo").hidden) acercaCerrar(); });
$("borrarTodo").onclick = async () => { if (!lista.length || !confirm(t("delAllConfirm"))) return; await BD.vaciar(); lista = []; $("nuevo").click(); };
$("exportar").onclick = () => {
  const blob = new Blob([JSON.stringify({ app: "quipullm", version: 1, chats: ordenada() })], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "quipullm-chats-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$("importar").onclick = () => $("archivo").click();
$("archivo").onchange = async () => {
  const f = $("archivo").files[0]; $("archivo").value = ""; if (!f) return;
  let n = 0;
  try {
    const j = JSON.parse(await f.text());
    if (!j || j.app !== "quipullm" || !Array.isArray(j.chats)) throw new Error("x");
    for (const x of j.chats.slice(0, MAX_CHATS)) {
      const c = limpiar(x); if (!c) continue;
      const previo = lista.find((y) => y.id === c.id);
      if (previo && previo.actualizado >= c.actualizado) continue;     // keep the newer copy
      await BD.poner(c); lista = lista.filter((y) => y.id !== c.id); lista.push(c); n++;
    }
    pintarLista(); alert(t("imported", { n }));
  } catch { alert(t("importBad")); }
};
async function iniciarChats() {
  let guardado = "0", lat = null;
  try { guardado = localStorage.getItem("quipullm_retencion") || "0"; lat = localStorage.getItem("quipullm_lateral"); } catch {}
  $("retencion").value = ["0", "30", "90"].includes(guardado) ? guardado : "0";
  $("lateral").hidden = lat === null ? innerWidth <= 760 : lat !== "1";
  if (await BD.abrir()) {
    lista = await BD.todos();
    await podar();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  } else { BD.fallo = true; $("lateral").hidden = true; $("lat").style.display = "none"; estado(); }
  pintarLista();
}
textos(); iniciarChats(); estado(); setInterval(() => { if (!ocupado) estado(); }, 5000); $("texto").focus();
</script>
