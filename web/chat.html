<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quipullm chat</title>
<style>
  :root { color-scheme: light dark; --fondo:#f6f7f9; --panel:#ffffff; --linea:#e1e5ea; --texto:#1c2128; --tenue:#6b7280; --acento:#0f5ea8; --acento2:#0c4d8a; --sobreacento:#fff; --codigo:#f0f2f5; --mal:#cf222e; --sombra:0 2px 14px rgba(16,24,40,.08); --cab:#1f2a37; }
  @media (prefers-color-scheme: dark) {
    :root { --fondo:#0e1217; --panel:#171c23; --linea:#2a313b; --texto:#e8ebf0; --tenue:#9aa4b2; --acento:#5aa7f0; --acento2:#7bb8f4; --sobreacento:#08131f; --codigo:#10151b; --mal:#ff7b72; --sombra:0 2px 18px rgba(0,0,0,.45); --cab:#151a21; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; display:flex; flex-direction:column; font-family:"Segoe UI", system-ui, -apple-system, sans-serif; background:var(--fondo); color:var(--texto); font-size:16px; line-height:1.55; }
  a { color:var(--acento); }
  header { background:var(--cab); color:#fff; padding:10px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; border-bottom:1px solid var(--linea); }
  header .marca { display:flex; align-items:center; gap:8px; font-weight:600; font-size:17px; letter-spacing:.2px; }
  header a { color:#bcd9f7; font-size:13px; text-decoration:none; padding:4px 8px; border-radius:6px; }
  header a:hover { background:rgba(255,255,255,.1); }
  select { font-family:inherit; font-size:13px; padding:5px 8px; border-radius:8px; border:1px solid var(--linea); background:var(--panel); color:var(--texto); max-width:270px; }
  header select { background:rgba(255,255,255,.08); color:#fff; border-color:rgba(255,255,255,.2); }
  header select option { color:#1c2128; background:#fff; }
  .espacio { flex:1; }
  .insignia { padding:2px 10px; border-radius:12px; font-size:12px; font-weight:600; background:#fff4c2; color:#7a5200; }
  .insignia.ok { background:#d9f5e0; color:#14672d; } .insignia.mal { background:#ffe3e0; color:#a4161f; }
  .btn-cab { font-family:inherit; font-size:13px; color:#fff; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); border-radius:8px; padding:5px 12px; cursor:pointer; }
  .btn-cab:hover { background:rgba(255,255,255,.2); }
  #avisos { padding:0 16px; }
  .aviso { background:#fff4c2; border:1px solid #e6c34a; color:#5b4300; border-radius:10px; padding:9px 14px; margin:12px auto 0; max-width:820px; font-size:14px; }
  .aviso input { font-family:inherit; font-size:14px; padding:5px 9px; border:1px solid #c9ced6; border-radius:8px; margin:0 6px; }
  .aviso button { font-family:inherit; font-size:13px; border:1px solid #b9962b; background:#fff; color:#3b2c00; border-radius:8px; padding:5px 11px; cursor:pointer; }
  main { flex:1; overflow-y:auto; padding:20px 16px 8px; }
  #mensajes { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  .vacio { text-align:center; margin-top:8vh; }
  .vacio svg { width:64px; height:64px; color:var(--acento); }
  .vacio h2 { font-size:26px; margin:12px 0 6px; font-weight:600; }
  .vacio p { color:var(--tenue); max-width:560px; margin:0 auto 22px; font-size:15px; }
  .sugerencias { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .sugerencias button { font-family:inherit; font-size:14px; background:var(--panel); color:var(--texto); border:1px solid var(--linea); border-radius:14px; padding:10px 14px; cursor:pointer; max-width:260px; text-align:left; box-shadow:var(--sombra); }
  .sugerencias button:hover { border-color:var(--acento); }
  .msg { overflow-wrap:anywhere; }
  .msg.user { align-self:flex-end; background:var(--acento); color:var(--sobreacento); border-radius:18px 18px 4px 18px; padding:10px 16px; max-width:85%; white-space:pre-wrap; }
  .msg.assistant { align-self:flex-start; width:100%; padding:2px 4px; }
  .msg .cuerpo { white-space:pre-wrap; }
  .msg .bloque { position:relative; margin:10px 0; }
  .msg .bloque .cp { position:absolute; top:6px; right:8px; font-family:inherit; font-size:12px; padding:1px 9px; background:var(--panel); color:var(--tenue); border:1px solid var(--linea); border-radius:8px; cursor:pointer; }
  .msg pre { background:var(--codigo); border:1px solid var(--linea); border-radius:10px; padding:10px 12px; overflow-x:auto; margin:0; white-space:pre; }
  .msg code { font-family:Consolas, "Cascadia Mono", monospace; font-size:13.5px; background:var(--codigo); border-radius:5px; padding:1px 5px; }
  .msg pre code { background:none; padding:0; }
  .msg details { color:var(--tenue); font-style:italic; margin-bottom:8px; white-space:pre-wrap; font-size:14px; border-left:3px solid var(--linea); padding-left:10px; }
  .msg details summary { cursor:pointer; font-style:normal; }
  .msg.error { color:var(--mal); border-left:3px solid var(--mal); padding-left:10px; }
  .meta { color:var(--tenue); font-size:12px; margin-top:6px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .meta button { font-family:inherit; font-size:12px; padding:1px 9px; background:transparent; color:var(--tenue); border:1px solid var(--linea); border-radius:8px; cursor:pointer; }
  footer { padding:6px 16px 12px; }
  .caja { max-width:820px; margin:0 auto; }
  .compositor { display:flex; gap:8px; align-items:flex-end; background:var(--panel); border:1px solid var(--linea); border-radius:18px; padding:8px 8px 8px 16px; box-shadow:var(--sombra); }
  .compositor:focus-within { border-color:var(--acento); }
  textarea { flex:1; font-family:inherit; font-size:16px; border:0; outline:0; resize:none; overflow-y:hidden; min-height:28px; max-height:200px; background:transparent; color:var(--texto); padding:6px 0; }
  textarea::placeholder { color:var(--tenue); }
  button.enviar { font-family:inherit; font-size:14px; font-weight:600; border:0; background:var(--acento); color:var(--sobreacento); border-radius:12px; padding:9px 18px; cursor:pointer; }
  button.parar { font-family:inherit; font-size:14px; border:1px solid var(--linea); background:transparent; color:var(--texto); border-radius:12px; padding:9px 14px; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  .pie { display:flex; gap:14px; align-items:center; margin-top:8px; font-size:12px; color:var(--tenue); flex-wrap:wrap; justify-content:center; }
  .pie label { display:flex; gap:5px; align-items:center; }
  .pie input[type=number] { width:68px; font-family:inherit; font-size:12px; padding:3px 6px; border:1px solid var(--linea); border-radius:8px; background:var(--panel); color:var(--texto); }
  #sistema { width:100%; margin-top:8px; min-height:56px; font-size:14px; background:var(--panel); border:1px solid var(--linea); border-radius:12px; padding:8px 12px; }
  .privacidad { font-size:12px; color:var(--tenue); text-align:center; margin-top:6px; opacity:.85; }
</style>
</head>
<body>
<header>
  <span class="marca"><svg width="22" height="22" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M8 12h48"/><path d="M16 12v40M28 12v32M40 12v44M52 12v28"/><circle cx="16" cy="26" r="3.5" fill="currentColor"/><circle cx="16" cy="40" r="3.5" fill="currentColor"/><circle cx="28" cy="22" r="3.5" fill="currentColor"/><circle cx="40" cy="30" r="3.5" fill="currentColor"/><circle cx="40" cy="44" r="3.5" fill="currentColor"/><circle cx="52" cy="26" r="3.5" fill="currentColor"/></svg>quipullm</span>
  <select id="modelo" aria-label="Model"></select>
  <span id="estado" class="insignia"></span>
  <span class="espacio"></span>
  <button id="nuevo" type="button" class="btn-cab"></button>
  <a href="/" id="aPanel"></a>
  <select id="lang" aria-label="Language"><option value="en">English</option><option value="es">Español</option></select>
</header>
<div id="avisos"><div id="avisosTxt"></div><div id="avisoClave"></div></div>
<main><div id="mensajes" role="log" aria-live="polite"></div></main>
<footer><div class="caja">
  <div class="compositor">
    <textarea id="texto" rows="1"></textarea>
    <button id="parar" type="button" class="parar" disabled></button>
    <button id="enviar" type="button" class="enviar"></button>
  </div>
  <div class="pie">
    <a href="#" id="verSistema"></a>
  </div>
  <textarea id="sistema" hidden></textarea>
  <div class="privacidad" id="privacidad"></div>
  <span id="info" hidden></span>
</div></footer>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const TXT = {
  en: {
    title: "What can I help with?", sub: "This runs on the graphics card of the server PC. Your messages are kept only in this page: closing it or pressing New chat erases them.",
    send: "Send", stop: "Stop", newChat: "New chat", panel: "Panel", placeholder: "Write a message… (Enter to send, Shift+Enter for a new line)",
    system: "System instruction", systemPh: "Optional. Example: Answer briefly, in Spanish.",
    keyNeeded: "This server asks for an access key:", keyBtn: "Use key", keyBad: "That key was not accepted.",
    noModels: "No supported chat model was found in the models folder.", engineOff: "The engine is not connected. On the server PC open the panel and press “Open engine”.",
    ready: "ready", working: "busy", off: "engine off", down: "server unreachable",
    waiting: "waiting for the engine…", queued: "waiting in the queue ({n} before you)", loading: "loading the model…", generating: "generating…",
    first: "first token in {s} s", copy: "Copy", copied: "Copied", error: "Error: ", reasoning: "Reasoning", privacy: "Not encrypted (HTTP): use it only on a network you trust.",
    tokens: "{n} tokens", stopped: "stopped",
    sug1: "Explain what a database is in 3 sentences", sug2: "Write a short, polite email asking to move a meeting", sug3: "Give me 5 ideas for a school science project"
  },
  es: {
    title: "¿En qué puedo ayudarte?", sub: "Esto corre en la tarjeta gráfica de la PC servidora. Tus mensajes solo se guardan en esta página: al cerrarla o pulsar Nuevo chat se borran.",
    send: "Enviar", stop: "Parar", newChat: "Nuevo chat", panel: "Panel", placeholder: "Escribe un mensaje… (Enter envía, Shift+Enter hace salto de línea)",
    system: "Instrucción del sistema", systemPh: "Opcional. Ejemplo: Responde breve y en español.",
    keyNeeded: "Este servidor pide una clave de acceso:", keyBtn: "Usar clave", keyBad: "Esa clave no fue aceptada.",
    noModels: "No hay ningún modelo de chat compatible en la carpeta de modelos.", engineOff: "El motor no está conectado. En la PC servidora abre el panel y pulsa «Open engine».",
    ready: "listo", working: "ocupado", off: "motor apagado", down: "servidor inaccesible",
    waiting: "esperando al motor…", queued: "en cola ({n} antes que tú)", loading: "cargando el modelo…", generating: "generando…",
    first: "primer token en {s} s", copy: "Copiar", copied: "Copiado", error: "Error: ", reasoning: "Razonamiento", privacy: "Sin cifrar (HTTP): úsalo solo en una red de confianza.",
    tokens: "{n} tokens", stopped: "detenido",
    sug1: "Explica qué es una base de datos en 3 frases", sug2: "Escribe un correo corto y amable para pedir mover una reunión", sug3: "Dame 5 ideas para un proyecto de ciencias del colegio"
  }
};
let LANG = "en";
try { LANG = localStorage.getItem("quipullm_lang") || ((navigator.language || "en").startsWith("es") ? "es" : "en"); } catch { LANG = (navigator.language || "en").startsWith("es") ? "es" : "en"; }
const t = (k, v) => { let s = (TXT[LANG][k] ?? TXT.en[k] ?? k); if (v) for (const [a, b] of Object.entries(v)) s = s.split("{" + a + "}").join(b); return s; };
const CLAVE = { get() { try { return localStorage.getItem("llm_clave") || ""; } catch { return ""; } }, set(v) { try { localStorage.setItem("llm_clave", v); } catch {} } };
const cab = (extra = {}) => Object.assign({}, extra, CLAVE.get() ? { Authorization: "Bearer " + CLAVE.get() } : {});

let historial = [];          // {role, content}
let control = null, ocupado = false, requiereClave = false, claveValida = true, sesion = 0;

function textos() {
  document.documentElement.lang = LANG; $("lang").value = LANG;
  $("enviar").textContent = t("send"); $("parar").textContent = t("stop"); $("nuevo").textContent = t("newChat"); $("aPanel").textContent = t("panel");
  $("texto").placeholder = t("placeholder");
  $("verSistema").textContent = t("system"); $("sistema").placeholder = t("systemPh"); $("privacidad").textContent = t("privacy");
  if (!historial.length) vacio();
}
const LOGO = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round' aria-hidden='true'><path d='M8 12h48'/><path d='M16 12v40M28 12v32M40 12v44M52 12v28'/><circle cx='16' cy='26' r='3.5' fill='currentColor'/><circle cx='16' cy='40' r='3.5' fill='currentColor'/><circle cx='28' cy='22' r='3.5' fill='currentColor'/><circle cx='40' cy='30' r='3.5' fill='currentColor'/><circle cx='40' cy='44' r='3.5' fill='currentColor'/><circle cx='52' cy='26' r='3.5' fill='currentColor'/></svg>";
function vacio() {
  const d = $("mensajes"); d.textContent = "";
  const v = document.createElement("div"); v.className = "vacio";
  const doc = new DOMParser().parseFromString(LOGO, "image/svg+xml").documentElement;
  v.append(document.importNode(doc, true));
  const h = document.createElement("h2"); h.textContent = t("title");
  const p = document.createElement("p"); p.textContent = t("sub");
  const c = document.createElement("div"); c.className = "sugerencias";
  for (const k of ["sug1", "sug2", "sug3"]) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = t(k);
    b.onclick = () => { $("texto").value = t(k); autoAltura(); enviar(); };
    c.append(b);
  }
  v.append(h, p, c); d.append(v);
}

// Small safe renderer: code blocks, `inline code` and **bold**. Everything is inserted as text nodes (as text nodes only).
function inline(padre, txt) {
  for (const parte of txt.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/)) {
    if (!parte) continue;
    if (parte.startsWith("`") && parte.endsWith("`") && parte.length > 2) { const c = document.createElement("code"); c.textContent = parte.slice(1, -1); padre.append(c); }
    else if (parte.startsWith("**") && parte.endsWith("**") && parte.length > 4) { const b = document.createElement("strong"); b.textContent = parte.slice(2, -2); padre.append(b); }
    else padre.append(document.createTextNode(parte));
  }
}
function pintar(cuerpo, texto) {
  cuerpo.textContent = "";
  const trozos = texto.split("```");
  trozos.forEach((tr, i) => {
    if (i % 2 === 1) {
      const pre = document.createElement("pre"), code = document.createElement("code");
      code.textContent = tr.replace(/^[A-Za-z0-9_+-]*\n/, "").replace(/\n$/, ""); pre.append(code);
      const caja = document.createElement("div"); caja.className = "bloque";
      const bc = document.createElement("button"); bc.type = "button"; bc.className = "cp"; bc.textContent = t("copy");
      bc.onclick = () => { copiarTexto(code.textContent); bc.textContent = t("copied"); setTimeout(() => { bc.textContent = t("copy"); }, 1200); };
      caja.append(pre, bc); cuerpo.append(caja);
    } else inline(cuerpo, tr);
  });
}
function burbuja(rol) {
  if (!historial.length && !$("mensajes").querySelector(".msg")) $("mensajes").textContent = "";
  const d = document.createElement("div"); d.className = "msg " + rol;
  const cuerpo = document.createElement("div"); cuerpo.className = "cuerpo"; d.append(cuerpo);
  $("mensajes").append(d); return { d, cuerpo };
}
function bajar() { const m = document.querySelector("main"); m.scrollTop = m.scrollHeight; }

async function estado() {
  let st;
  try { st = await (await fetch("/api/status")).json(); }
  catch { const e = $("estado"); e.className = "insignia mal"; e.textContent = t("down"); return null; }
  requiereClave = !!st.requires_key;
  const e = $("estado"), conectado = st.engine.connected;
  e.className = "insignia " + (conectado ? "ok" : "mal");
  e.textContent = conectado ? (st.current_job ? t("working") : t("ready")) : t("off");
  const sel = $("modelo"), previo = sel.value;
  const todos = st.models.filter((x) => x.supported && !x.embedding);
  let lista = todos;
  const orden = st.chat_models || [];
  if (orden.length) {            // the owner chose which models appear here, and in which order
    const pos = new Map(orden.map((id, i) => [id, i]));
    lista = todos.filter((x) => pos.has(x.id)).sort((a, b) => pos.get(a.id) - pos.get(b.id));
    if (!lista.length) lista = todos;      // the saved list names models that no longer exist
  }
  $("aPanel").style.display = st.panel_allowed ? "" : "none";
  const firma = lista.map((x) => x.id).join("|");
  if (sel.dataset.firma !== firma) {
    sel.dataset.firma = firma;
    sel.textContent = "";
    for (const x of lista) { const o = document.createElement("option"); o.textContent = x.id; sel.append(o); }
    if (previo && lista.some((x) => x.id === previo)) sel.value = previo;
    else if (!orden.length && st.engine.loaded_model && lista.some((x) => x.id === st.engine.loaded_model)) sel.value = st.engine.loaded_model;
    else if (lista.length) sel.value = lista[0].id;
  }
  const act = lista.find((x) => x.id === $("modelo").value) || lista[0];
  $("avisosTxt").textContent = "";
  if (!lista.length) aviso(t("noModels"));
  else if (!conectado) aviso(t("engineOff"));
  const necesitaClave = requiereClave && (!CLAVE.get() || !claveValida);
  if (necesitaClave && !$("avisoClave").firstChild) pedirClave(CLAVE.get() ? t("keyBad") : "");
  if (!necesitaClave) $("avisoClave").textContent = "";
  return st;
}
function aviso(txt) { const d = document.createElement("div"); d.className = "aviso"; d.textContent = txt; $("avisosTxt").append(d); }
function pedirClave(extra) {
  const d = document.createElement("div"); d.className = "aviso";
  const i = document.createElement("input"); i.type = "password"; i.autocomplete = "off";
  const b = document.createElement("button"); b.textContent = t("keyBtn"); b.type = "button";
  const ok = () => { CLAVE.set(i.value.trim()); claveValida = true; estado(); };
  b.onclick = ok; i.onkeydown = (e) => { if (e.key === "Enter") ok(); };
  d.append(document.createTextNode((extra ? extra + " " : "") + t("keyNeeded")), i, b); $("avisoClave").append(d);
}

function fase(st) {
  if (!st) return t("waiting");
  const j = st.current_job;
  if (j && j.phase === "generating") return t("generating");
  if (st.queued > 0) return t("queued", { n: st.queued });
  if (j) return t(j.phase === "queued" ? "waiting" : "loading");
  return t("waiting");
}

async function enviar() {
  const txt = $("texto").value.trim();
  if (!txt || ocupado) return;
  if (!$("modelo").value) return;
  const mi = sesion;
  ocupado = true; $("enviar").disabled = true; $("parar").disabled = false;
  $("texto").value = ""; autoAltura();
  const u = burbuja("user"); u.cuerpo.textContent = txt; historial.push({ role: "user", content: txt });
  const a = burbuja("assistant");
  const meta = document.createElement("div"); meta.className = "meta"; a.d.append(meta);
  let razon = null, razonTxt = "", cont = "", n = 0, primer = null, parado = false;
  const t0 = performance.now();
  a.cuerpo.textContent = t("waiting"); bajar();
  const sondeo = setInterval(async () => { if (primer) return; try { const st = await (await fetch("/api/status")).json(); if (!primer) { a.cuerpo.textContent = fase(st); } } catch {} }, 1500);
  control = new AbortController();
  const mensajes = ($("sistema").value.trim() ? [{ role: "system", content: $("sistema").value.trim() }] : []).concat(historial);
  try {
    const r = await fetch("/v1/chat/completions", {
      method: "POST", headers: cab({ "Content-Type": "application/json" }), signal: control.signal,
      body: JSON.stringify({ model: $("modelo").value, stream: true, messages: mensajes })
    });
    if (!r.ok) {
      let m = r.status + "";
      try { m = (await r.json()).error.message; } catch {}
      if (r.status === 401) { claveValida = false; estado(); }
      throw new Error(m);
    }
    const lector = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await lector.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const linea = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!linea.startsWith("data:")) continue;
        const d = linea.slice(5).trim();
        if (d === "[DONE]") continue;
        const j = JSON.parse(d);
        if (j.error) throw new Error(j.error.message);
        const delta = (j.choices && j.choices[0] && j.choices[0].delta) || {};
        if (delta.reasoning_content) {
          razonTxt += delta.reasoning_content;
          if (!razon) { razon = document.createElement("details"); razon.open = true; const s = document.createElement("summary"); s.textContent = t("reasoning"); razon.append(s, document.createElement("span")); a.d.insertBefore(razon, a.cuerpo); }
          razon.lastChild.textContent = razonTxt;
        }
        if (delta.content) cont += delta.content;
        if (delta.content || delta.reasoning_content) { n++; if (!primer) { primer = performance.now(); if (!cont) a.cuerpo.textContent = ""; } }
        if (delta.content) pintar(a.cuerpo, cont);
        if (j.usage) n = j.usage.completion_tokens;
        const s = primer ? (performance.now() - primer) / 1000 : 0;
        meta.textContent = t("tokens", { n }) + " · " + t("first", { s: ((primer - t0) / 1000).toFixed(1) }) + (s > 0.5 ? " · " + (n / s).toFixed(1) + " tok/s" : "");
        bajar();
      }
    }
  } catch (e) {
    if (e.name === "AbortError") { parado = true; }
    else { a.d.classList.add("error"); a.cuerpo.textContent = t("error") + e.message; }
  } finally {
    clearInterval(sondeo);
    ocupado = false; $("enviar").disabled = false; $("parar").disabled = true; control = null;
    if (mi !== sesion) return;            // "New chat" was pressed meanwhile: this answer no longer belongs to the conversation
    if (razon && cont) razon.open = false;
    if (parado) { meta.append(document.createTextNode(" · " + t("stopped"))); if (!cont && !razonTxt) a.cuerpo.textContent = ""; }
    if (cont) {
      historial.push({ role: "assistant", content: cont });
      const c = document.createElement("button"); c.type = "button"; c.textContent = t("copy");
      c.onclick = () => { copiarTexto(cont); c.textContent = t("copied"); setTimeout(() => { c.textContent = t("copy"); }, 1200); };
      meta.append(c);
    } else if (!a.d.classList.contains("error")) { historial.pop(); if (!razonTxt) a.d.remove(); }
    else historial.pop();
    $("texto").focus(); estado();
  }
}

function copiarTexto(txt) {      // navigator.clipboard only works on https:// or localhost: fallback for http://192.168...
  const respaldo = () => { const x = document.createElement("textarea"); x.value = txt; x.style.position = "fixed"; x.style.opacity = "0"; document.body.append(x); x.select(); try { document.execCommand("copy"); } catch {} x.remove(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).catch(respaldo); else respaldo();
}
function autoAltura() { const x = $("texto"); x.style.height = "auto"; x.style.height = Math.min(x.scrollHeight, 200) + "px"; x.style.overflowY = x.scrollHeight > 200 ? "auto" : "hidden"; }
$("texto").oninput = autoAltura;
$("texto").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); enviar(); } };
$("enviar").onclick = enviar;
$("modelo").onchange = () => estado();
$("parar").onclick = () => control && control.abort();
$("nuevo").onclick = () => { sesion++; if (control) control.abort(); historial = []; vacio(); $("texto").focus(); };
$("verSistema").onclick = (e) => { e.preventDefault(); $("sistema").hidden = !$("sistema").hidden; if (!$("sistema").hidden) $("sistema").focus(); };
$("lang").onchange = () => { LANG = $("lang").value; try { localStorage.setItem("quipullm_lang", LANG); } catch {} textos(); estado(); };
textos(); estado(); setInterval(() => { if (!ocupado) estado(); }, 5000); $("texto").focus();
</script>
